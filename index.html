<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração Financeira | Plataforma de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0C1922;
    --bg-sidebar:#0A1620;
    --bg-panel:rgba(255,255,255,0.04);
    --bg-panel-strong:rgba(255,255,255,0.07);
    --ink:#F2F0E8;
    --ink-soft:#A9B7C2;
    --ink-faint:#6E7C88;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --gold:#C99A3E;
    --gold-soft:rgba(201,154,62,0.14);
    --gold-text:#E4BA6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns:320px 1fr;
    min-height:100vh;
  }
  .sidebar{
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    padding:28px 0 24px 0;
    display:flex;
    flex-direction:column;
  }
  .brand{
    padding:0 24px 22px 24px;
    border-bottom:1px solid var(--border);
    margin-bottom:8px;
  }
  .logo{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
    padding:5px;
    overflow:hidden;
  }
  .logo img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    line-height:1.25;
    margin:0 0 6px 0;
    color:var(--ink);
  }
  .brand p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.5;
  }
  nav.toc{
    flex:1;
    overflow-y:auto;
    padding:10px 12px 0 12px;
  }
  .toc-item{
    display:flex;
    align-items:baseline;
    gap:12px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-left:2px solid transparent;
    padding:11px 14px;
    cursor:pointer;
    border-radius:6px;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink-soft);
    transition:background .12s ease, color .12s ease;
  }
  .toc-item:hover{ background:rgba(255,255,255,0.04); color:var(--ink); }
  .toc-item.active{
    background:var(--gold-soft);
    border-left:2px solid var(--gold);
    color:var(--ink);
  }
  .toc-item.home{ margin-bottom:6px; }
  .toc-divider{
    border-top:1px solid var(--border);
    margin:8px 14px 10px 14px;
  }
  .toc-section-label{
    padding:2px 16px 8px 16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0;
  }
  .toc-code{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--gold-text);
    min-width:20px;
    flex-shrink:0;
  }
  .toc-title{
    font-size:13.5px;
    line-height:1.4;
  }
  .toc-item.active .toc-title{ font-weight:500; color:var(--ink); }
  .sidebar-foot{
    padding:16px 24px 0 24px;
    border-top:1px solid var(--border);
    margin-top:12px;
    font-size:12px;
    color:var(--ink-faint);
    line-height:1.6;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:1px solid var(--border-strong);
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .back-btn:hover{ background:var(--bg-panel); color:var(--ink); border-color:var(--gold); }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold-text);
    margin:0 0 14px 0;
  }
  .home-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:44px;
    line-height:1.12;
    margin:0 0 20px 0;
    color:var(--ink);
    max-width:620px;
  }
  .home-lead{
    font-size:15.5px;
    color:var(--ink-soft);
    line-height:1.75;
    max-width:600px;
    margin:0 0 28px 0;
  }
  .home-actions{
    display:flex;
    gap:12px;
    margin-bottom:40px;
  }
  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .btn.primary{
    background:var(--gold);
    color:#1A1206;
    border-color:var(--gold);
  }
  .btn.primary:hover{ background:var(--gold-text); }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--border-strong);
  }
  .btn.secondary:hover{ background:var(--bg-panel); }
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
  }
  .stat-card{
    background:var(--bg-panel);
    padding:18px 20px;
  }
  .stat-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 8px 0;
  }
  .stat-value{
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    line-height:1.3;
  }
  .module-preview{ margin-top:44px; }
  .module-preview h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 16px 0;
  }
  .preview-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .preview-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:baseline;
    transition:background .12s ease, border-color .12s ease;
  }
  .preview-card:hover{ background:var(--bg-panel-strong); border-color:var(--border-strong); }
  .preview-card .code{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--gold-text); flex-shrink:0; }
  .preview-card .title{ font-size:13.5px; color:var(--ink); line-height:1.4; }
  .page-head{ margin-bottom:28px; }
  .page-head .code{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--gold-text);
    letter-spacing:.04em;
  }
  .page-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    line-height:1.18;
    margin:6px 0 12px 0;
    color:var(--ink);
  }
  .page-head .ementa{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.65;
    max-width:660px;
  }
  .status-row{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    padding:5px 10px;
    border-radius:20px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--ink-soft);
  }
  .badge-added{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#8FCBA8;
    background:rgba(143,203,168,0.12);
    padding:3px 8px;
    border-radius:20px;
  }
  section.block{
    margin-top:36px;
    padding-top:28px;
    border-top:1px solid var(--border);
  }
  section.block h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 18px 0;
  }
  .content-item{ margin-bottom:26px; }
  .content-item:last-child{ margin-bottom:0; }
  .content-item h4{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    margin:0 0 10px 0;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .content-item p{
    font-size:14.5px;
    line-height:1.75;
    color:var(--ink-soft);
    margin:0 0 10px 0;
  }
  .content-item p:last-child{ margin-bottom:0; }
  .content-item p strong{ color:var(--ink); font-weight:600; }
  .content-item p.example{
    background:var(--bg-panel);
    border-left:3px solid var(--gold);
    padding:10px 14px;
    border-radius:0;
  }
  .ledger-lines{ list-style:none; margin:0; padding:0; }
  .ledger-lines li{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 4px;
    border-bottom:1px dashed var(--border);
    font-size:14px;
    color:var(--ink-soft);
  }
  .ledger-lines li .n{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-faint);
    width:32px;
    flex-shrink:0;
  }
  .ledger-lines li.empty-hint{ font-style:italic; color:var(--ink-faint); }

  .exercise-list{
    margin:0;
    padding-left:1.4em;
    counter-reset:none;
  }
  .exercise-list li{
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.7;
    padding:14px 0;
    border-bottom:1px dashed var(--border);
  }
  .exercise-list li::marker{
    font-family:'IBM Plex Mono', monospace;
    color:var(--gold-text);
    font-weight:600;
  }
  .exercise-list li:last-child{ border-bottom:none; }
  .exercise-tipo{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:8px;
    background:var(--bg-panel-strong);
    border:1px solid var(--border-strong);
    color:var(--ink-soft);
  }
  .exercise-tipo.tipo-múltipla-escolha{ background:var(--gold-soft); color:var(--gold-text); border-color:rgba(201,154,62,0.35); }
  .exercise-tipo.tipo-estudo-de-caso{ background:rgba(143,203,168,0.14); color:#8FCBA8; border-color:rgba(143,203,168,0.35); }
  .exercise-tipo.tipo-estudo-de-caso-cálculo{ background:rgba(143,203,168,0.14); color:#8FCBA8; border-color:rgba(143,203,168,0.35); }
  .exercise-text{ margin:0; color:var(--ink); font-size:14.5px; line-height:1.7; }
  .exercise-options{
    list-style:none;
    margin:10px 0 0 0;
    padding:0;
  }
  .exercise-options li{
    display:flex;
    gap:10px;
    padding:5px 0;
    border-bottom:none;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .opt-letter{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--gold-text);
    border:1px solid var(--border-strong);
    border-radius:4px;
    width:20px;
    height:20px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .exercise-download{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    margin-bottom:18px;
  }

  .case-data-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:12px;
    margin:12px 0 16px 0;
  }
  .case-data-group{
    background:var(--bg-deep);
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px 14px;
  }
  .case-data-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--gold-text);
    margin:0 0 8px 0;
  }
  .case-data-items{
    list-style:none;
    margin:0;
    padding:0;
  }
  .case-data-items li{
    font-size:13px;
    color:var(--ink-soft);
    padding:3px 0;
    border-bottom:none;
  }
  .case-tarefas-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:14px 0 6px 0;
  }
  .exercise-options.case-tarefas li{
    align-items:flex-start;
  }
  .exercise-options.case-tarefas .opt-letter{
    border-radius:50%;
    font-family:'IBM Plex Mono', monospace;
  }
  .materials-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .material-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
  }
  .material-card .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold-text);
    margin-bottom:8px;
  }
  .material-card .desc{ font-size:13px; color:var(--ink-faint); line-height:1.5; }

  .data-table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  .data-table th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    padding:0 12px 10px 12px;
    border-bottom:1px solid var(--border-strong);
  }
  .data-table td{
    padding:12px;
    border-bottom:1px solid var(--border);
    color:var(--ink-soft);
  }
  .data-table tr:last-child td{ border-bottom:none; }
  .data-table td.center, .data-table th.center{ text-align:center; }
  .data-table.matrix td:first-child{ color:var(--ink); }

  .role-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.02em;
    padding:4px 10px;
    border-radius:20px;
    display:inline-block;
  }
  .role-aluno{ background:rgba(169,183,194,0.14); color:var(--ink-soft); border:1px solid var(--border-strong); }
  .role-professor{ background:var(--gold-soft); color:var(--gold-text); border:1px solid rgba(201,154,62,0.35); }
  .role-mestre{ background:rgba(143,203,168,0.14); color:#8FCBA8; border:1px solid rgba(143,203,168,0.35); }

  .count-badge{
    display:inline-block;
    background:var(--bg-panel-strong);
    border:1px solid var(--border);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    margin-left:8px;
    text-transform:none;
    letter-spacing:0;
  }

  .panel-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px;
  }
  .panel-note{
    font-size:13px;
    color:var(--ink-faint);
    line-height:1.6;
    margin:0 0 18px 0;
    max-width:620px;
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 16px;
    margin-bottom:18px;
  }
  .form-field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:7px;
  }
  .form-field input, .form-field select{
    width:100%;
    background:var(--bg-deep);
    border:1px solid var(--border-strong);
    border-radius:6px;
    padding:10px 12px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
  }
  .form-field input::placeholder{ color:var(--ink-faint); }
  .form-field input:focus, .form-field select:focus{
    outline:none;
    border-color:var(--gold);
  }
  .form-field select option{ background:var(--bg-deep); color:var(--ink); }

  .btn.danger{
    background:transparent;
    color:#D98B7A;
    border:1px solid rgba(217,139,122,0.4);
  }
  .btn.danger:hover{ background:rgba(217,139,122,0.12); }
  .btn:disabled{ opacity:0.55; cursor:default; }
  .btn.secondary:disabled:hover{ background:transparent; }

  .user-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:12px;
  }
  .user-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
  }
  .user-card.active{ border-color:var(--gold); background:var(--gold-soft); }
  .user-card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
  }
  .user-name{ font-size:14px; font-weight:500; color:var(--ink); line-height:1.4; }
  .user-detail{ font-size:12.5px; color:var(--ink-faint); margin:0 0 4px 0; line-height:1.5; }
  .user-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
  }
  .user-actions .btn{ padding:7px 12px; font-size:12.5px; }

  .step-card{
    display:flex;
    gap:16px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px;
    margin-bottom:14px;
  }
  .step-card.warning{
    border-color:rgba(217,139,122,0.4);
    background:rgba(217,139,122,0.06);
  }
  .step-num{
    width:32px;
    height:32px;
    border-radius:50%;
    border:2px solid var(--gold);
    color:var(--gold-text);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    flex-shrink:0;
  }
  .step-card.warning .step-num{ border-color:#D98B7A; color:#D98B7A; }
  .step-body{ flex:1; min-width:0; }
  .step-body h4{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 8px 0;
    color:var(--ink);
  }
  .step-body p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.65;
    margin:0 0 14px 0;
  }
  .info-strip{
    background:var(--bg-deep);
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px 14px;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:12px;
  }
  .info-strip strong{ color:var(--ink); }
  .instructions-box{
    background:var(--bg-deep);
    border:1px dashed var(--border-strong);
    border-radius:6px;
    padding:14px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.75;
    margin-top:10px;
  }
  .instructions-box code{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--gold-text);
  }

  .audit-filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:18px;
  }
  .audit-filters select{
    background:var(--bg-panel);
    border:1px solid var(--border-strong);
    border-radius:6px;
    padding:9px 12px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
  }
  .audit-filters select option{ background:var(--bg-deep); color:var(--ink); }

  .role-tipo-criação{ background:rgba(143,203,168,0.14); color:#8FCBA8; border:1px solid rgba(143,203,168,0.35); }
  .role-tipo-edição{ background:var(--gold-soft); color:var(--gold-text); border:1px solid rgba(201,154,62,0.35); }
  .role-tipo-exclusão{ background:rgba(217,139,122,0.14); color:#D98B7A; border:1px solid rgba(217,139,122,0.35); }
  .role-tipo-backup{ background:rgba(169,183,194,0.14); color:var(--ink-soft); border:1px solid var(--border-strong); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
  .mobile-menu-btn{
    display:none;
  }
  .sidebar-scrim{
    display:none;
  }

  @media (max-width: 860px){
    .app{ grid-template-columns:1fr; }
    main{ padding:32px 24px 32px 24px; }
    .materials-grid{ grid-template-columns:1fr; }
    .stats-grid{ grid-template-columns:1fr 1fr; }
    .preview-grid{ grid-template-columns:1fr; }
    .home-title{ font-size:32px; }

    .mobile-menu-btn{
      display:flex;
      align-items:center;
      gap:8px;
      position:fixed;
      top:16px;
      left:16px;
      z-index:60;
      background:var(--bg-sidebar);
      color:var(--ink);
      border:1px solid var(--border-strong);
      border-radius:8px;
      padding:9px 14px;
      font-family:'IBM Plex Sans', sans-serif;
      font-size:14px;
      font-weight:500;
      cursor:pointer;
    }
    main{ padding-top:76px; }

    .sidebar{
      position:fixed;
      top:0;
      left:0;
      height:100vh;
      width:290px;
      max-width:82vw;
      z-index:70;
      border-right:1px solid var(--border);
      transform:translateX(-100%);
      transition:transform .22s ease;
      box-shadow:0 0 0 rgba(0,0,0,0);
    }
    .app.menu-open .sidebar{
      transform:translateX(0);
      box-shadow:20px 0 40px rgba(0,0,0,0.35);
    }
    .sidebar-scrim{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      z-index:65;
    }
    .app.menu-open .sidebar-scrim{ display:block; }
  }
</style>
</head>

              <td>ICJ = LO / DF</td>

      {
        heading:"Ativos Permanentes: Conceito e Classificação",
        paragraphs:[
          "Os <strong>Ativos Permanentes</strong> (também chamados de Ativo Imobilizado ou Capital Fixo) são os bens tangíveis e intangíveis que a empresa utiliza de forma duradoura em suas operações, com o objetivo de gerar receita — e não de revenda. Incluem máquinas, equipamentos, veículos, imóveis, móveis e instalações.",
          "Diferem do <strong>Ativo Circulante</strong> (caixa, estoques, contas a receber) por terem baixa liquidez e vida útil longa, geralmente superior a um ano. Por isso, sua administração exige planejamento de longo prazo e envolve decisões estratégicas de investimento de capital.",
          "A correta gestão dos ativos permanentes impacta diretamente a capacidade produtiva da empresa, seus custos operacionais e sua estrutura de capital, já que normalmente são financiados por recursos de longo prazo (capital próprio ou empréstimos de longo prazo)."
        ]
      },
      {
        heading:"Depreciação: Conceito e Finalidade",
        paragraphs:[
          "<strong>Depreciação</strong> é a perda de valor de um ativo permanente ao longo do tempo, em decorrência do uso, do desgaste físico, da ação da natureza ou da obsolescência tecnológica.",
          "<strong>Finalidade contábil:</strong> reconhecer, em cada exercício, a parcela do custo do ativo que foi \"consumida\" na geração de receita, respeitando o regime de competência (confrontação entre receitas e despesas).",
          "<strong>Finalidade gerencial:</strong> apurar corretamente o custo de produção, apoiar decisões de reposição de equipamentos e servir de base para o planejamento tributário e financeiro da empresa.",
          "Terrenos, em regra, não são depreciados, pois não perdem valor pelo uso — apenas as edificações, máquinas, equipamentos, móveis e veículos sofrem depreciação."
        ]
      },
      {
        heading:"Métodos de Depreciação",
        paragraphs:[
          "<strong>Método Linear (Quotas Constantes):</strong> distribui o valor depreciável do ativo em parcelas iguais ao longo da vida útil. É o método mais utilizado no Brasil por sua simplicidade e por ser aceito pela legislação fiscal.",
          "<strong>Método dos Saldos Decrescentes (Depreciação Acelerada):</strong> aplica uma taxa fixa sobre o valor contábil residual de cada período, gerando quotas maiores nos primeiros anos e menores ao final. Reflete melhor ativos que perdem eficiência mais rapidamente no início de sua vida útil.",
          "<strong>Método das Unidades Produzidas:</strong> vincula a depreciação ao volume efetivamente produzido ou utilizado (horas de uso, quilômetros rodados, unidades fabricadas), sendo mais adequado quando o desgaste do ativo está diretamente ligado à intensidade de uso."
        ]
      },
      {
        heading:"Depreciação pelo Método Linear",
        paragraphs:[
          "<strong>Valor Depreciável (VD):</strong> VD = VA − VR, onde VA é o Valor de Aquisição do bem e VR é o Valor Residual estimado ao final da vida útil.",
          "<strong>Taxa Anual de Depreciação (TD%):</strong> TD% = 1 / n, onde n é a vida útil estimada em anos.",
          "<strong>Quota Anual de Depreciação (QAD):</strong> QAD = VD × TD% (equivalente a QAD = VD / n).",
          "<strong>Depreciação Acumulada (DA):</strong> DA = QAD × t, onde t é o número de anos já transcorridos desde a aquisição do bem.",
          "<strong>Valor Contábil Líquido (VCL):</strong> VCL = VA − DA. Representa o valor pelo qual o ativo está registrado na contabilidade em determinado momento."
        ]
      },
      {

  function editTurma(id){
    const t = turmas.find(x => x.id === id);
    if(!t) return;
    const novoNome = prompt('Novo nome da turma:', t.nome);
    if(novoNome === null) return;
    const nomeTrim = novoNome.trim();
    if(!nomeTrim) return;
    const nomeAntigo = t.nome;
    usuarios.forEach(u => { if(u.turma === nomeAntigo) u.turma = nomeTrim; });
    t.nome = nomeTrim;
    logAudit('Edição', nomeTrim, `Renomeou a turma "${nomeAntigo}" para "${nomeTrim}"`);
    renderTurmas();
  }

  function removeTurma(id){
    const t = turmas.find(x => x.id === id);
    if(!t) return;
    const vinculados = usuarios.filter(u => u.turma === t.nome).length;
    if(vinculados > 0){
      if(!confirm(`Essa turma tem ${vinculados} usuário(s) vinculado(s). Ao excluir, eles ficarão sem turma. Deseja continuar?`)) return;
      usuarios.forEach(u => { if(u.turma === t.nome) u.turma = '—'; });
    }
    const idx = turmas.findIndex(x => x.id === id);
    if(idx > -1) turmas.splice(idx, 1);
    logAudit('Exclusão', t.nome, `Excluiu a turma ${t.nome}`);
    renderTurmas();
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function nowFormatted(){
    const d = new Date();
    return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  function dateForFilename(){

  function downloadBackup(){
    const payload = { geradoEm: new Date().toISOString(), usuarios, turmas, auditoria };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup_administracao_financeira_${dateForFilename()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    lastBackupInfo = nowFormatted();
    logAudit('Backup', '—', 'Gerou um backup completo da plataforma');
    renderBackup();
  }

  function restoreBackupFile(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if(!confirm('Restaurar este backup vai substituir todos os usuários, turmas e o log de auditoria carregados agora nesta plataforma. Deseja continuar?')) return;
        if(Array.isArray(data.usuarios)){ usuarios.length = 0; usuarios.push(...data.usuarios); }
        if(Array.isArray(data.turmas)){ turmas.length = 0; turmas.push(...data.turmas); }
        if(Array.isArray(data.auditoria)){ auditoria.length = 0; auditoria.push(...data.auditoria); }
        nextUserId = usuarios.reduce((max,u) => Math.max(max, u.id||0), 0) + 1;
        if(!usuarios.find(u => u.id === activeUserId)){ activeUserId = usuarios.length ? usuarios[0].id : null; }
        auditoria.unshift({ data:nowFormatted(), usuario:currentActiveUserName(), turma:'—', tipo:'Backup', descricao:'Restaurou um backup na plataforma' });
        renderBackup();
        alert('Backup restaurado com sucesso.');
      } catch(e){
        alert('Não foi possível ler este arquivo. Confirme se é um backup .json gerado por esta plataforma.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function consolidateBackupFiles(event){
    const files = Array.from(event.target.files || []);
    if(!files.length) return;
    let pending = files.length;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if(Array.isArray(data.usuarios)){
            data.usuarios.forEach(u => usuarios.push({ ...u, id:nextUserId++ }));
          }
          if(Array.isArray(data.turmas)){
            data.turmas.forEach(t => { if(!turmas.find(ex => ex.nome === t.nome)) turmas.push(t); });
          }
          if(Array.isArray(data.auditoria)){ auditoria.push(...data.auditoria); }
        } catch(e){ /* arquivo inválido, ignorado */ }
        pending--;
        if(pending === 0){
          auditoria.unshift({ data:nowFormatted(), usuario:currentActiveUserName(), turma:'—', tipo:'Backup', descricao:`Consolidou ${files.length} backup(s) recebido(s)` });
          renderBackup();
        }
      };
      reader.readAsText(file);
    });
    event.target.value = '';
  }

  let auditFiltro = { usuario:'', turma:'', tipo:'' };

  function auditFilteredRows(){
    return auditoria.filter(a =>
      (!auditFiltro.usuario || a.usuario === auditFiltro.usuario) &&
      (!auditFiltro.turma || a.turma === auditFiltro.turma) &&
      (!auditFiltro.tipo || a.tipo === auditFiltro.tipo)
    );

  function exportAuditCsv(){
    const rows = auditFilteredRows();
    const header = ['Data/Hora','Usuário','Turma','Ação','Descrição'];
    const csvLines = [header.join(';')].concat(
      rows.map(a => [a.data, a.usuario, a.turma, a.tipo, a.descricao.replace(/;/g,',')].join(';'))
    );
    const blob = new Blob([csvLines.join('\n')], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `auditoria_administracao_financeira_${dateForFilename()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

        <h3>Log de atividades</h3>
        <p class="ementa" style="margin-bottom:16px;">Todo cadastro, edição ou exclusão feito na plataforma fica registrado aqui automaticamente, com data/hora, usuário e turma — e não pode ser apagado pela interface. Use os filtros para investigar uma ação específica.</p>

        <div class="audit-filters">
          <select id="audit-filter-usuario" onchange="applyAuditFilters()">
            <option value="">Todos os usuários</option>
            ${usuariosUnicos.map(u => `<option value="${u}" ${auditFiltro.usuario===u?'selected':''}>${u}</option>`).join('')}
          </select>
          <select id="audit-filter-turma" onchange="applyAuditFilters()">
            <option value="">Todas as turmas</option>
            ${turmasUnicas.map(t => `<option value="${t}" ${auditFiltro.turma===t?'selected':''}>${t}</option>`).join('')}
          </select>
          <select id="audit-filter-tipo" onchange="applyAuditFilters()">
            <option value="">Todas as ações</option>
            ${tipos.map(t => `<option value="${t}" ${auditFiltro.tipo===t?'selected':''}>${t}</option>`).join('')}
          </select>
          <button class="btn secondary" onclick="exportAuditCsv()">Exportar log (CSV)</button>
        </div>

        <table class="data-table">
          <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Turma</th><th>Ação</th><th>Descrição</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>

        <div class="instructions-box" style="margin-top:20px;">
          <strong>Como usar para monitorar:</strong> peça para o aluno exportar o backup completo (página Backup) periodicamente e enviar para você — o log de atividades vai junto no arquivo. Ao restaurar esse backup nesta plataforma (em um navegador à parte, só para conferência), você vê aqui o histórico completo do que foi feito, inclusive o que foi excluído.
        </div>
        <div class="instructions-box">
          Para não crescer indefinidamente, este log mantém apenas os <strong>1000 registros mais recentes</strong> — os mais antigos são descartados automaticamente à medida que novos são criados.
        </div>
      </section>
    `;
  }

  function render(){
    renderToc();
    if(activeIndex === -1){ renderHome(); }
    else if(activeIndex === 'turmas'){ renderTurmas(); }
    else if(activeIndex === 'usuarios'){ renderUsuarios(); }
    else if(activeIndex === 'relatorios'){ renderRelatorios(); }
    else if(activeIndex === 'backup'){ renderBackup(); }
    else if(activeIndex === 'auditoria'){ renderAuditoria(); }
    else { renderModule(); }
  }

  render();
</script>

</body>
</html>
