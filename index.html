<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração Financeira | Plataforma de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0C1922;
    --bg-sidebar:#0A1620;
    --bg-panel:rgba(255,255,255,0.04);
    --bg-panel-strong:rgba(255,255,255,0.07);
    --ink:#F2F0E8;
    --ink-soft:#A9B7C2;
    --ink-faint:#6E7C88;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --gold:#C99A3E;
    --gold-soft:rgba(201,154,62,0.14);
    --gold-text:#E4BA6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns:320px 1fr;
    min-height:100vh;
  }
  .sidebar{
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    padding:28px 0 24px 0;
    display:flex;
    flex-direction:column;
  }
  .brand{
    padding:0 24px 22px 24px;
    border-bottom:1px solid var(--border);
    margin-bottom:8px;
  }
  .logo{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
    padding:5px;
    overflow:hidden;
  }
  .logo img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    line-height:1.25;
    margin:0 0 6px 0;
    color:var(--ink);
  }
  .brand p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.5;
  }
  nav.toc{
    flex:1;
    overflow-y:auto;
    padding:10px 12px 0 12px;
  }
  .toc-item{
    display:flex;
    align-items:baseline;
    gap:12px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-left:2px solid transparent;
    padding:11px 14px;
    cursor:pointer;
    border-radius:6px;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink-soft);
    transition:background .12s ease, color .12s ease;
  }
  .toc-item:hover{ background:rgba(255,255,255,0.04); color:var(--ink); }
  .toc-item.active{
    background:var(--gold-soft);
    border-left:2px solid var(--gold);
    color:var(--ink);
  }
  .toc-item.home{ margin-bottom:6px; }
  .toc-divider{
    border-top:1px solid var(--border);
    margin:8px 14px 10px 14px;
  }
  .toc-section-label{
    padding:2px 16px 8px 16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0;
  }
  .toc-code{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--gold-text);
    min-width:20px;
    flex-shrink:0;
  }
  .toc-title{
    font-size:13.5px;
    line-height:1.4;
  }
  .toc-item.active .toc-title{ font-weight:500; color:var(--ink); }
  .sidebar-foot{
    padding:16px 24px 0 24px;
    border-top:1px solid var(--border);
    margin-top:12px;
    font-size:12px;
    color:var(--ink-faint);
    line-height:1.6;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:transparent;
    border:1px solid var(--border-strong);
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .back-btn:hover{ background:var(--bg-panel); color:var(--ink); border-color:var(--gold); }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gold-text);
    margin:0 0 14px 0;
  }
  .home-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:44px;
    line-height:1.12;
    margin:0 0 20px 0;
    color:var(--ink);
    max-width:620px;
  }
  .home-lead{
    font-size:15.5px;
    color:var(--ink-soft);
    line-height:1.75;
    max-width:600px;
    margin:0 0 28px 0;
  }
  .home-actions{
    display:flex;
    gap:12px;
    margin-bottom:40px;
  }
  .btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .btn.primary{
    background:var(--gold);
    color:#1A1206;
    border-color:var(--gold);
  }
  .btn.primary:hover{ background:var(--gold-text); }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--border-strong);
  }
  .btn.secondary:hover{ background:var(--bg-panel); }
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
  }
  .stat-card{
    background:var(--bg-panel);
    padding:18px 20px;
  }
  .stat-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 8px 0;
  }
  .stat-value{
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    line-height:1.3;
  }
  .module-preview{ margin-top:44px; }
  .module-preview h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 16px 0;
  }
  .preview-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .preview-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:baseline;
    transition:background .12s ease, border-color .12s ease;
  }
  .preview-card:hover{ background:var(--bg-panel-strong); border-color:var(--border-strong); }
  .preview-card .code{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--gold-text); flex-shrink:0; }
  .preview-card .title{ font-size:13.5px; color:var(--ink); line-height:1.4; }
  .page-head{ margin-bottom:28px; }
  .page-head .code{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--gold-text);
    letter-spacing:.04em;
  }
  .page-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    line-height:1.18;
    margin:6px 0 12px 0;
    color:var(--ink);
  }
  .page-head .ementa{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.65;
    max-width:660px;
  }
  .status-row{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    padding:5px 10px;
    border-radius:20px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--ink-soft);
  }
  .badge-added{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#8FCBA8;
    background:rgba(143,203,168,0.12);
    padding:3px 8px;
    border-radius:20px;
  }
  section.block{
    margin-top:36px;
    padding-top:28px;
    border-top:1px solid var(--border);
  }
  section.block h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 18px 0;
  }
  .content-item{ margin-bottom:26px; }
  .content-item:last-child{ margin-bottom:0; }
  .content-item h4{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    margin:0 0 10px 0;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .content-item p{
    font-size:14.5px;
    line-height:1.75;
    color:var(--ink-soft);
    margin:0 0 10px 0;
  }
  .content-item p:last-child{ margin-bottom:0; }
  .content-item p strong{ color:var(--ink); font-weight:600; }
  .content-item p.example{
    background:var(--bg-panel);
    border-left:3px solid var(--gold);
    padding:10px 14px;
    border-radius:0;
  }
  .ledger-lines{ list-style:none; margin:0; padding:0; }
  .ledger-lines li{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 4px;
    border-bottom:1px dashed var(--border);
    font-size:14px;
    color:var(--ink-soft);
  }
  .ledger-lines li .n{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-faint);
    width:32px;
    flex-shrink:0;
  }
  .ledger-lines li.empty-hint{ font-style:italic; color:var(--ink-faint); }
  .materials-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .material-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
  }
  .material-card .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold-text);
    margin-bottom:8px;
  }
  .material-card .desc{ font-size:13px; color:var(--ink-faint); line-height:1.5; }

  .data-table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  .data-table th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:500;
    padding:0 12px 10px 12px;
    border-bottom:1px solid var(--border-strong);
  }
  .data-table td{
    padding:12px;
    border-bottom:1px solid var(--border);
    color:var(--ink-soft);
  }
  .data-table tr:last-child td{ border-bottom:none; }
  .data-table td.center, .data-table th.center{ text-align:center; }
  .data-table.matrix td:first-child{ color:var(--ink); }

  .role-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.02em;
    padding:4px 10px;
    border-radius:20px;
    display:inline-block;
  }
  .role-aluno{ background:rgba(169,183,194,0.14); color:var(--ink-soft); border:1px solid var(--border-strong); }
  .role-professor{ background:var(--gold-soft); color:var(--gold-text); border:1px solid rgba(201,154,62,0.35); }
  .role-mestre{ background:rgba(143,203,168,0.14); color:#8FCBA8; border:1px solid rgba(143,203,168,0.35); }

  .count-badge{
    display:inline-block;
    background:var(--bg-panel-strong);
    border:1px solid var(--border);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    margin-left:8px;
    text-transform:none;
    letter-spacing:0;
  }

  .panel-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:20px;
  }
  .panel-note{
    font-size:13px;
    color:var(--ink-faint);
    line-height:1.6;
    margin:0 0 18px 0;
    max-width:620px;
  }
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 16px;
    margin-bottom:18px;
  }
  .form-field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:7px;
  }
  .form-field input, .form-field select{
    width:100%;
    background:var(--bg-deep);
    border:1px solid var(--border-strong);
    border-radius:6px;
    padding:10px 12px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
  }
  .form-field input::placeholder{ color:var(--ink-faint); }
  .form-field input:focus, .form-field select:focus{
    outline:none;
    border-color:var(--gold);
  }
  .form-field select option{ background:var(--bg-deep); color:var(--ink); }

  .btn.danger{
    background:transparent;
    color:#D98B7A;
    border:1px solid rgba(217,139,122,0.4);
  }
  .btn.danger:hover{ background:rgba(217,139,122,0.12); }
  .btn:disabled{ opacity:0.55; cursor:default; }
  .btn.secondary:disabled:hover{ background:transparent; }

  .user-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:12px;
  }
  .user-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
  }
  .user-card.active{ border-color:var(--gold); background:var(--gold-soft); }
  .user-card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
  }
  .user-name{ font-size:14px; font-weight:500; color:var(--ink); line-height:1.4; }
  .user-detail{ font-size:12.5px; color:var(--ink-faint); margin:0 0 4px 0; line-height:1.5; }
  .user-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
  }
  .user-actions .btn{ padding:7px 12px; font-size:12.5px; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
  .mobile-menu-btn{
    display:none;
  }
  .sidebar-scrim{
    display:none;
  }

  @media (max-width: 860px){
    .app{ grid-template-columns:1fr; }
    main{ padding:32px 24px 32px 24px; }
    .materials-grid{ grid-template-columns:1fr; }
    .stats-grid{ grid-template-columns:1fr 1fr; }
    .preview-grid{ grid-template-columns:1fr; }
    .home-title{ font-size:32px; }

    .mobile-menu-btn{
      display:flex;
      align-items:center;
      gap:8px;
      position:fixed;
      top:16px;
      left:16px;
      z-index:60;
      background:var(--bg-sidebar);
      color:var(--ink);
      border:1px solid var(--border-strong);
      border-radius:8px;
      padding:9px 14px;
      font-family:'IBM Plex Sans', sans-serif;
      font-size:14px;
      font-weight:500;
      cursor:pointer;
    }
    main{ padding-top:76px; }

    .sidebar{
      position:fixed;
      top:0;
      left:0;
      height:100vh;
      width:290px;
      max-width:82vw;
      z-index:70;
      border-right:1px solid var(--border);
      transform:translateX(-100%);
      transition:transform .22s ease;
      box-shadow:0 0 0 rgba(0,0,0,0);
    }
    .app.menu-open .sidebar{
      transform:translateX(0);
      box-shadow:20px 0 40px rgba(0,0,0,0.35);
    }
    .sidebar-scrim{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      z-index:65;
    }
    .app.menu-open .sidebar-scrim{ display:block; }
  }
</style>
</head>

  <div class="sidebar-scrim" id="sidebar-scrim"></div>

  function addUsuario(){
    const nomeEl = document.getElementById('new-user-nome');
    const perfilEl = document.getElementById('new-user-perfil');
    const matriculaEl = document.getElementById('new-user-matricula');
    const turmaEl = document.getElementById('new-user-turma');
    const nome = nomeEl.value.trim();
    if(!nome){ nomeEl.focus(); return; }
    const perfilKey = perfilEl.value;
    const papelLabel = perfilKey === 'aluno' ? 'Aluno' : perfilKey === 'professor' ? 'Professor' : 'Usuário Mestre';
    usuarios.push({
      id: nextUserId++,
      nome,
      papel: papelLabel,
      papelKey: perfilKey,
      matricula: matriculaEl.value.trim() || '—',
      turma: turmaEl.value || '—',
    });
    renderUsuarios();
  }

  function removeUsuario(id){
    if(id === activeUserId){
      alert('Não é possível excluir o usuário ativo. Selecione "Usar este usuário" em outro cadastro antes de excluir este.');
      return;
    }
    const idx = usuarios.findIndex(u => u.id === id);
    if(idx > -1) usuarios.splice(idx, 1);
    renderUsuarios();
  }

  function showPermissions(){
    const section = document.getElementById('permissions-section');
    if(section) section.scrollIntoView({behavior:'smooth'});
  }

  function renderRelatorios(){
    const main = document.getElementById('main');
    const cards = relatorios.map(r => `
      <div class="material-card">
        <div class="label">${r.nome}</div>
        <div class="desc">${r.desc}</div>
      </div>`).join('');

    main.innerHTML = `
      <button class="back-btn" onclick="goToModule(-1)">← Voltar ao início</button>
      <div class="page-head">
        <p class="code">Gestão</p>
        <h2>Relatórios</h2>
        <p class="ementa">Relatórios disponíveis para acompanhar o desempenho dos alunos e o uso da plataforma. Nesta etapa de protótipo, os relatórios ainda não geram dados reais.</p>
        <div class="status-row"><span class="pill">${relatorios.length} relatórios disponíveis</span></div>
      </div>
      <section class="block">
        <h3>Relatórios disponíveis</h3>
        <div class="materials-grid" style="grid-template-columns:repeat(2,1fr);">${cards}</div>
      </section>
    `;
  }

  function renderBackup(){
    const main = document.getElementById('main');
    const rows = backups.map(b => `
      <tr>
        <td>${b.data}</td>
        <td>${b.tipo}</td>
        <td>${b.tamanho}</td>
        <td>${b.status}</td>
      </tr>`).join('');

    main.innerHTML = `
      <button class="back-btn" onclick="goToModule(-1)">← Voltar ao início</button>
      <div class="page-head">
        <p class="code">Gestão</p>
        <h2>Backup</h2>
        <p class="ementa">Histórico de backups da plataforma. Neste protótipo estático a lista é ilustrativa; em uma versão com backend, os backups seriam gerados e armazenados automaticamente.</p>
        <div class="status-row">
          <span class="pill">Último backup: ${backups[0].data}</span>
          <span class="pill">${backups.length} backups no histórico</span>
        </div>
      </div>
      <section class="block">
        <h3>Histórico de backups</h3>
        <table class="data-table">
          <thead><tr><th>Data</th><th>Tipo</th><th>Tamanho</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>
    `;
  }

  function renderAuditoria(){
    const main = document.getElementById('main');
    const rows = auditoria.map(a => `
      <tr>
        <td>${a.data}</td>
        <td>${a.usuario}</td>
        <td>${a.acao}</td>
      </tr>`).join('');

    main.innerHTML = `
      <button class="back-btn" onclick="goToModule(-1)">← Voltar ao início</button>
      <div class="page-head">
        <p class="code">Gestão</p>
        <h2>Auditoria</h2>
        <p class="ementa">Registro das ações realizadas na plataforma — quem alterou o quê e quando, para acompanhamento e controle.</p>
        <div class="status-row"><span class="pill">${auditoria.length} eventos registrados</span></div>
      </div>
      <section class="block">
        <h3>Últimos eventos</h3>
        <table class="data-table">
          <thead><tr><th>Data</th><th>Usuário</th><th>Ação</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>
    `;
  }

  function render(){
    renderToc();
    if(activeIndex === -1){ renderHome(); }
    else if(activeIndex === 'turmas'){ renderTurmas(); }
    else if(activeIndex === 'usuarios'){ renderUsuarios(); }
    else if(activeIndex === 'relatorios'){ renderRelatorios(); }
    else if(activeIndex === 'backup'){ renderBackup(); }
    else if(activeIndex === 'auditoria'){ renderAuditoria(); }
    else { renderModule(); }
  }

  render();
</script>

</body>
</html>
